<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Split conformal calibration workflow</title>
  <desc id="description">Split development data into a fitting partition and a held-out calibration partition. Fit the complete estimator only on the fitting partition, score calibration observations, select a finite-sample threshold, and apply it to future predictions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#52616b" />
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #222832; }
      .node { fill: #f2f6fa; stroke: #3776ab; stroke-width: 3; rx: 16; }
      .cal { fill: #fff4e8; stroke: #f89939; }
      .title { font-size: 23px; font-weight: 700; }
      .copy { font-size: 18px; }
      .arrow { stroke: #52616b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#ffffff" />
  <text x="600" y="45" text-anchor="middle" class="title">Held-out split conformal prediction</text>
  <rect class="node" x="35" y="125" width="190" height="150" />
  <text x="130" y="168" text-anchor="middle" class="title">Development data</text>
  <text x="130" y="208" text-anchor="middle" class="copy">Features + targets</text>
  <text x="130" y="238" text-anchor="middle" class="copy">Before any fitting</text>
  <path class="arrow" d="M 230 200 H 275" />
  <rect class="node" x="290" y="100" width="210" height="110" />
  <text x="395" y="142" text-anchor="middle" class="title">Fit partition</text>
  <text x="395" y="178" text-anchor="middle" class="copy">Fit full pipeline</text>
  <rect class="node cal" x="290" y="245" width="210" height="110" />
  <text x="395" y="287" text-anchor="middle" class="title">Calibration</text>
  <text x="395" y="323" text-anchor="middle" class="copy">Held-out scores</text>
  <path class="arrow" d="M 505 155 H 555" />
  <path class="arrow" d="M 505 300 H 555" />
  <rect class="node" x="570" y="125" width="210" height="150" />
  <text x="675" y="168" text-anchor="middle" class="title">Calibrate</text>
  <text x="675" y="208" text-anchor="middle" class="copy">Score held-out rows</text>
  <text x="675" y="238" text-anchor="middle" class="copy">Select rank threshold</text>
  <path class="arrow" d="M 785 200 H 835" />
  <rect class="node" x="850" y="125" width="300" height="150" />
  <text x="1000" y="168" text-anchor="middle" class="title">Predict future rows</text>
  <text x="1000" y="208" text-anchor="middle" class="copy">Point + interval, or</text>
  <text x="1000" y="238" text-anchor="middle" class="copy">point + class set</text>
  <text x="600" y="397" text-anchor="middle" class="copy">Keep calibration data independent of every learned step and model selection.</text>
</svg>
