<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">How classification scores form prediction sets</title>
  <desc id="description">For probabilities A 0.55, B 0.30, and C 0.15, a LAC threshold of 0.5 includes only A. A deterministic APS threshold of 0.9 includes A and B because their descending cumulative scores are 0.55 and 0.85.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #222832; }
      .head { font-size: 26px; font-weight: 700; }
      .label { font-size: 21px; }
      .small { font-size: 18px; fill: #52616b; }
      .included { fill: #e6f2fb; stroke: #3776ab; stroke-width: 2; rx: 10; }
      .excluded { fill: #f2f4f6; stroke: #9aa6af; stroke-width: 2; rx: 10; }
      .rule { stroke: #d8dee4; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#ffffff" />
  <text x="600" y="48" text-anchor="middle" class="head">Candidate scores are compared with a calibrated threshold</text>
  <text x="55" y="112" class="head">Candidate</text>
  <text x="300" y="112" text-anchor="middle" class="head">Probability</text>
  <text x="590" y="112" text-anchor="middle" class="head">LAC score: 1 − p</text>
  <text x="925" y="112" text-anchor="middle" class="head">APS cumulative score</text>
  <path class="rule" d="M 45 130 H 1155" />
  <text x="75" y="184" class="label">A</text>
  <text x="300" y="184" text-anchor="middle" class="label">0.55</text>
  <rect class="included" x="470" y="148" width="240" height="52" />
  <text x="590" y="182" text-anchor="middle" class="label">0.45 ✓</text>
  <rect class="included" x="805" y="148" width="240" height="52" />
  <text x="925" y="182" text-anchor="middle" class="label">0.55 ✓</text>
  <text x="75" y="254" class="label">B</text>
  <text x="300" y="254" text-anchor="middle" class="label">0.30</text>
  <rect class="excluded" x="470" y="218" width="240" height="52" />
  <text x="590" y="252" text-anchor="middle" class="label">0.70</text>
  <rect class="included" x="805" y="218" width="240" height="52" />
  <text x="925" y="252" text-anchor="middle" class="label">0.85 ✓</text>
  <text x="75" y="324" class="label">C</text>
  <text x="300" y="324" text-anchor="middle" class="label">0.15</text>
  <rect class="excluded" x="470" y="288" width="240" height="52" />
  <text x="590" y="322" text-anchor="middle" class="label">0.85</text>
  <rect class="excluded" x="805" y="288" width="240" height="52" />
  <text x="925" y="322" text-anchor="middle" class="label">1.00</text>
  <text x="590" y="384" text-anchor="middle" class="small">Example threshold: 0.50</text>
  <text x="925" y="384" text-anchor="middle" class="small">Example threshold: 0.90</text>
  <text x="600" y="448" text-anchor="middle" class="small">Illustration only: thresholds are estimated from held-out calibration scores for the chosen alpha.</text>
</svg>
