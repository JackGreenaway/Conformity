[project]
name = "conformity-calib"
version = "0.1.11"
description = "Conformal prediction library for regression and classification with statistical uncertainty guarantees"
readme = "README.md"
authors = [
  { name = "Jack", email = "jackg18@hotmail.co.uk" },
]
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
  "numpy>=2.0.2",
  "scikit-learn>=1.6.1",
  "typing-extensions>=4.15.0",
]

[build-system]
requires = ["hatchling>=1.26,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformity"]

[dependency-groups]
dev = [
  "ipykernel>=6.31.0",
  "matplotlib>=3.9.4",
  "pandas>=2.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.14.9",
]

docs = [
  "mkdocs>=1.6,<2",
  "pymdown-extensions>=10.0,<11",
]
release = [
  "build>=1.2,<2",
  "twine>=6.0,<7",
  "hatchling>=1.26,<1.28",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
# Estimator-specific metadata and arbitrary NumPy label dtypes are intentionally dynamic.
ignore = ["ANN401"]
