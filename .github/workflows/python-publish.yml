name: Upload Python Package

on:
  workflow_run:
    workflows: [Create GitHub Release]
    types: [completed]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  release-build:
    # Automatic releases must finish successfully before any upload is allowed.
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Retrieve the validated GitHub release distributions
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: created-release-dists
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Releases published through the GitHub UI keep their existing build path.
      - name: Check out the published release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv for a manually published release
        if: github.event_name == 'release'
        uses: astral-sh/setup-uv@v5

      - name: Build manually published release distributions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv sync --locked --group docs --group release --python 3.12
          uv run --locked --group docs --group release --python 3.12 python - <<'PY'
          import os
          import tomllib

          from conformity import __version__

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if __version__ != version or os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag, project.version, and __version__ must match")
          PY
          bash scripts/validate.sh
          uv run --locked --group docs --group release --python 3.12 python -m build --no-isolation --outdir dist
          uv run --locked --group docs --group release --python 3.12 python -m twine check --strict dist/*
          uv run --locked --group docs --group release --python 3.12 python scripts/check_release.py --dist dist

      - name: Save distributions for the isolated publishing job
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: pypi
      url: https://pypi.org/project/conformity-calib/
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
