name: Upload Python Package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      artifact-name:
        description: Validated distributions from the calling release workflow
        required: true
        type: string
      release-tag:
        description: Release tag that must match the source and distribution versions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  release-build:
    # Both paths validate the tag; manually published releases also run all gates.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Install locked validation and build dependencies
        run: uv sync --locked --group docs --group release --python 3.12
      - name: Validate tagged source versions
        run: uv run --locked --group docs --group release --python 3.12 python scripts/check_release.py
      - name: Retrieve distributions supplied by the release workflow
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/release-dist
      - name: Validate manually published release
        if: inputs.artifact-name == ''
        run: bash scripts/validate.sh
      - name: Build manually published release from tagged source
        if: inputs.artifact-name == ''
        run: uv run --locked --group docs --group release --python 3.12 python -m build --no-isolation --outdir "$RUNNER_TEMP/release-dist"
      - name: Check distribution metadata and embedded versions
        run: |
          uv run --locked --group docs --group release --python 3.12 python -m twine check --strict "$RUNNER_TEMP/release-dist"/*
          uv run --locked --group docs --group release --python 3.12 python scripts/check_release.py --dist "$RUNNER_TEMP/release-dist"
      - name: Save validated distributions for the isolated publishing job
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            ${{ runner.temp }}/release-dist/*.whl
            ${{ runner.temp }}/release-dist/*.tar.gz
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/conformity-calib/
    steps:
      - name: Retrieve validated release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
