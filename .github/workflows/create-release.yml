name: Create GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  supported-python:
    uses: ./.github/workflows/tests.yml

  create-release:
    needs: supported-python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Install locked validation and build dependencies
        run: uv sync --locked --group docs --group release --python 3.12
      - name: Validate source version
        id: version
        run: uv run --locked --group docs --group release --python 3.12 python scripts/check_release.py --github-output
      - name: Reject an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-refs.json"
          uv run --locked --group docs --group release --python 3.12 python - <<'PY'
          import json
          import os
          from pathlib import Path
          refs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-refs.json').read_text())
          tag = os.environ['RELEASE_TAG']
          if any(ref['ref'] == f'refs/tags/{tag}' for ref in refs):
              raise SystemExit(f'{tag} already exists; bump both versions before releasing')
          PY
      - name: Validate package and documentation
        run: bash scripts/validate.sh
      - name: Build and check fresh distributions using locked tooling
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          uv run --locked --group docs --group release --python 3.12 python -m build --no-isolation --outdir "$RUNNER_TEMP/release-dist"
          uv run --locked --group docs --group release --python 3.12 python -m twine check --strict "$RUNNER_TEMP/release-dist"/*
          uv run --locked --group docs --group release --python 3.12 python scripts/check_release.py --dist "$RUNNER_TEMP/release-dist"
      - name: Save validated distributions for trusted publishing
        uses: actions/upload-artifact@v4
        with:
          name: created-release-dists
          path: |
            ${{ runner.temp }}/release-dist/*.whl
            ${{ runner.temp }}/release-dist/*.tar.gz
          if-no-files-found: error
      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_DIST"/*.whl "$RELEASE_DIST"/*.tar.gz \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  publish:
    needs: create-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python-publish.yml
    with:
      artifact-name: created-release-dists
      release-tag: ${{ needs.create-release.outputs.tag }}
