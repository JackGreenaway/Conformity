name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            sklearn: 'scikit-learn==1.6.1'
            numpy: 'numpy==2.0.2'
          - python: '3.13'
            sklearn: 'scikit-learn'
            numpy: 'numpy'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install library and test dependencies
        run: |
          uv venv
          uv pip install -e . '${{ matrix.sklearn }}' '${{ matrix.numpy }}' pytest pytest-cov 'ruff==0.14.9' pandas
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Test
        run: uv run --no-sync pytest --cov=conformity --cov-report=term-missing
      - name: Build distribution
        run: uv build
