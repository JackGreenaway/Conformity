name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            sklearn: 'scikit-learn==1.6.1'
            numpy: 'numpy==2.0.2'
          - python: '3.13'
            sklearn: 'scikit-learn'
            numpy: 'numpy'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install library and test dependencies
        run: python -m pip install -e . '${{ matrix.sklearn }}' '${{ matrix.numpy }}' pytest pytest-cov ruff pandas build
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=conformity --cov-report=term-missing
      - name: Build distribution
        run: python -m build
