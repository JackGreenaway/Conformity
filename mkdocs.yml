site_name: Conformity
site_description: Held-out conformal intervals and prediction sets for scikit-learn estimators.
site_url: https://jackgreenaway.github.io/Conformity/
repo_url: https://github.com/JackGreenaway/Conformity
repo_name: JackGreenaway/Conformity
edit_uri: edit/main/docs/
strict: true
theme:
  name: mkdocs
  custom_dir: docs_theme
  color_mode: dark
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages: [python, bash]
nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - User guide:
      - Overview: user-guide/index.md
      - Estimators and pipelines: user-guide/estimators.md
      - Regression intervals: user-guide/regression.md
      - Classification sets: user-guide/classification.md
      - Calibration and guarantees: user-guide/calibration.md
      - Diagnostics and errors: user-guide/diagnostics.md
      - Theory: theory.md
      - Plotting: plotting.md
  - API reference:
      - Overview: api/index.md
      - Estimators: api/estimators.md
      - Metrics:
          - Overview: api/metrics.md
          - Classification:
              - Set coverage: api/metrics/prediction-set-coverage.md
              - Coverage by class: api/metrics/prediction-set-coverage-by-class.md
              - Set size: api/metrics/prediction-set-size.md
              - Empty set rate: api/metrics/prediction-set-empty-rate.md
              - Singleton set rate: api/metrics/prediction-set-singleton-rate.md
          - Regression:
              - Interval coverage: api/metrics/prediction-interval-coverage.md
              - Lower miss rate: api/metrics/prediction-interval-lower-miss-rate.md
              - Upper miss rate: api/metrics/prediction-interval-upper-miss-rate.md
              - Interval width: api/metrics/prediction-interval-width.md
              - Normalized interval width: api/metrics/normalized-prediction-interval-width.md
              - Interval score: api/metrics/interval-score.md
      - BaseConformalPredictor: classes/base-conformal-predictor.md
      - ConformalRegressor: classes/conformal-regressor.md
      - ConformalClassifier: classes/conformal-classifier.md
  - Examples:
      - Overview: examples/index.md
      - Regression decisions: examples/regression.md
      - Classification review: examples/classification.md
      - Visual examples: examples/plots.md
      - Cross-validation: examples/cross-validation.md
  - Development and deployment: development.md
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
extra_css: [stylesheets/extra.css]
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
